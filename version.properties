# Jump version registry
#
# `version` is the Semantic Versioning release identifier and MUST match the
# newest `## [x.y.z]` heading in CHANGELOG.md. The Gradle build derives both
# `versionName` (the semver string) and `versionCode` from the fields below, so
# a release can never ship with a stale or duplicated version code.
#
# versionCode 1 is reserved for 0.1.0, and each release bumps it by one.
version=1.0.1
versionCode=3

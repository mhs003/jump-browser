# Project-level Gradle settings for on-device Termux builds.
#
# No aapt2 workaround is needed. The Termux aarch64 aapt2 handles every AGP 9
# resource task, including optimizeReleaseResources, which was verified with R8
# minification and resource shrinking enabled.
android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 and resource shrinking for the release build are the heaviest part of the
# build. With the default 512m daemon heap the CI JVM garbage collector
# thrashes and Gradle aborts with "build daemon has been stopped". Give the
# daemon room and keep workers in-process so CI does not pay for a second
# sizeable JVM next to the minifier.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2g

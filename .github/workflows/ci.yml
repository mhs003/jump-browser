name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version and changelog agree
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' version.properties | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error::version.properties has no version"; exit 1
          fi
          # The release body is generated from this section, so an empty one
          # would publish a release with no notes.
          notes="$(bash .github/release-notes.sh "$version" 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no (or an empty) '## [$version]' section"
            exit 1
          fi

      - name: Check the version was bumped
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A PR may legitimately keep the version; a push to master may not.
          # Every push ships a new installable build, so versionCode must move
          # or devices cannot update over each other.
          if [ "$EVENT" != "push" ]; then
            echo "not a push; skipping the bump check"
            exit 0
          fi
          git fetch --no-tags --depth=2 origin master
          prev="$(git show HEAD~1:version.properties 2>/dev/null | sed -n 's/^versionCode=//p' | tr -d '\r' || true)"
          now="$(sed -n 's/^versionCode=//p' version.properties | tr -d '\r')"
          if [ -z "$prev" ]; then
            echo "no previous version.properties (first push); nothing to compare"
            exit 0
          fi
          if [ "$prev" -ge "$now" ]; then
            # Some pushes legitimately ship no new app build: fixing the
            # release tooling, workflows or docs carries no user-facing change.
            subject="$(git log -1 --pretty=%s)"
            case "$subject" in
              "chore(release): "*|"ci(release): "*|"docs(release): "*)
                echo "no bump needed for '$subject'"
                exit 0
                ;;
            esac
            echo "::error::versionCode did not increase ($prev -> $now). Run scripts/bump-version.sh <patch|minor|major> before pushing, or mark the commit ci(release):/docs(release):."
            exit 1
          fi
          echo "versionCode $prev -> $now"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jump-debug
          # ABI splits rename the outputs; upload every variant so the
          # universal APK is available alongside the per-architecture ones.
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$tag' is not a semantic version tag (vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version and changelog agree
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          file_version="$(sed -n 's/^version=//p' version.properties | tr -d '\r')"
          code="$(sed -n 's/^versionCode=//p' version.properties | tr -d '\r')"
          if [ -z "$file_version" ] || [ -z "$code" ]; then
            echo "::error::version.properties must define version and versionCode"; exit 1
          fi
          if [ "$file_version" != "$TAG_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but version.properties says $file_version"
            exit 1
          fi
          if ! grep -qE "^## \[${TAG_VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' section"
            exit 1
          fi
          echo "Releasing $TAG_VERSION (versionCode $code)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Restore release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify artifact
        id: artifact
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          [ -f "$apk" ] || { echo "::error::Release APK was not produced"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/Jump-$VERSION.apk"
          (cd dist && sha256sum "Jump-$VERSION.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          if [ "${HAS_KEYSTORE:-}" != "true" ]; then
            echo "::warning::No release keystore secrets configured; the APK is signed with the debug key and is not store-ready."
          fi
          echo "apk=dist/Jump-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          {
            echo "**Jump $VERSION**"
            echo
            bash .github/release-notes.sh "$VERSION"
            echo
            echo "### Install"
            echo
            echo "Download \`Jump-$VERSION.apk\` below and verify it with the attached \`SHA256SUMS.txt\`."
            echo "Requires Android 8.0 (API 26) or newer."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Jump ${{ steps.tag.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.apk }}
            dist/SHA256SUMS.txt

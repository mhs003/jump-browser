name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  # Required for actions/upload-artifact; without it the upload step fails.
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$tag' is not a semantic version tag (vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check version against changelog
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          file_version="$(sed -n 's/^version=//p' version.properties | tr -d '\r')"
          code="$(sed -n 's/^versionCode=//p' version.properties | tr -d '\r')"
          if [ -z "$file_version" ] || [ -z "$code" ]; then
            echo "::error::version.properties must define version and versionCode"
            exit 1
          fi
          if [ "$file_version" != "$TAG_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but version.properties says $file_version"
            exit 1
          fi
          section="$(bash .github/release-notes.sh "$TAG_VERSION" | tr -d '[:space:]')"
          if [ -z "$section" ]; then
            echo "::error::CHANGELOG.md section [$TAG_VERSION] is missing or empty, so the release would have no notes"
            exit 1
          fi
          echo "Releasing $TAG_VERSION (versionCode $code)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_SECRET:-}" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; signing with the debug key."
            exit 0
          fi
          for name in RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              case "$name" in
                RELEASE_KEYSTORE_PASSWORD) missing=KEYSTORE_PASSWORD ;;
                RELEASE_KEY_ALIAS) missing=KEY_ALIAS ;;
                *) missing=KEY_PASSWORD ;;
              esac
              echo "::error::secret $name is empty; set it or remove RELEASE_KEYSTORE_BASE64 so the debug key is used"
              exit 1
            fi
          done

          jks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_SECRET" | base64 -d > "$jks"

          # Fail here, with a readable message, rather than 70 seconds later
          # inside :app:packageRelease with "keystore password was incorrect".
          keytool -list \
            -keystore "$jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS do not open the stored keystore"; exit 1; }

          {
            echo "storeFile=$jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          set -euo pipefail
          mkdir -p build-logs
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build-logs/release.log

      - name: Report build failure
        if: failure()
        run: |
          # Annotations are visible without signing in, unlike the job log, so
          # echo the first real Gradle failure line there too.
          line="$(grep -m1 -E '^e: |What went wrong|Caused by|> Task .* FAILED|Could not (resolve|download|install)' build-logs/release.log || true)"
          if [ -n "$line" ]; then
            echo "::error title=Gradle failure::$line"
          fi
          {
            echo "## Release build failed"
            echo '```'
            grep -A 20 -E "What went wrong|FAILURE:" build-logs/release.log | head -60 || tail -60 build-logs/release.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # AGP deflates the dex at zlib level 9; zopfli finds a shorter DEFLATE
      # stream for the same bytes, worth ~50 KB here. The repack strips the
      # signature (and the signing block, which is not a zip record), so the
      # APK is re-signed afterwards with the same key AGP used.
      - name: Repack with zopfli and re-sign
        run: |
          set -euo pipefail
          python3 -m pip install --quiet zopfli
          apk="app/build/outputs/apk/release/app-universal-release.apk"
          [ -f "$apk" ] || { echo "::error::universal release APK not found"; exit 1; }
          python3 scripts/repack_apk.py "$apk" "$apk.repacked"

          if [ -f keystore.properties ]; then
            # shellcheck disable=SC1091
            ks="$(grep '^storeFile=' keystore.properties | cut -d= -f2-)"
            pass="$(grep '^storePassword=' keystore.properties | cut -d= -f2-)"
            alias="$(grep '^keyAlias=' keystore.properties | cut -d= -f2-)"
            keypass="$(grep '^keyPassword=' keystore.properties | cut -d= -f2-)"
          else
            # Match AGP's debug-key fallback so the artifact stays installable.
            ks="$HOME/.android/debug.keystore"
            [ -f "$ks" ] || keytool -genkeypair -keystore "$ks" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            pass=android; alias=androiddebugkey; keypass=android
          fi

          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/lib/apksigner.jar | sort -V | tail -1)"
          java -jar "$apksigner" sign \
            --ks "$ks" --ks-pass pass:"$pass" --ks-key-alias "$alias" \
            --key-pass pass:"$keypass" \
            --out "$apk" "$apk.repacked"
          java -jar "$apksigner" verify "$apk"
          echo "Repacked and re-signed $(basename "$apk")"
          sha256sum "$apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build-logs/release.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Package artifact
        id: artifact
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # ABI splits rename the per-architecture outputs, so pick the
          # universal APK, which installs on every supported device.
          apk="app/build/outputs/apk/release/app-universal-release.apk"
          if [ ! -f "$apk" ]; then
            apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' | head -1)"
          fi
          [ -f "$apk" ] || { echo "::error::Release APK was not produced"; exit 1; }
          echo "Publishing $(basename "$apk")"
          mkdir -p dist
          cp "$apk" "dist/Jump-$VERSION.apk"
          (cd dist && sha256sum "Jump-$VERSION.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "apk=dist/Jump-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "**Jump $VERSION**"
            echo
            bash .github/release-notes.sh "$VERSION"
            echo
            echo "### Install"
            echo
            echo "Download \`Jump-$VERSION.apk\` and verify it against the attached \`SHA256SUMS.txt\`."
            echo "Requires Android 8.0 (API 26) or newer."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Jump ${{ steps.tag.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          generate_release_notes: false
          files: |
            ${{ steps.artifact.outputs.apk }}
            dist/SHA256SUMS.txt
